<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>GOD Characters</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #08080d;
      --panel: #11111a;
      --panel2: #181824;
      --text: #f5f5f7;
      --muted: #9696a8;
      --accent: #a855f7;
      --accent2: #ec4899;
      --border: rgba(255,255,255,.08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 15% 0%, rgba(168,85,247,.16), transparent 34%),
        radial-gradient(circle at 90% 10%, rgba(236,72,153,.10), transparent 30%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
    }

    button, input { font: inherit; }

    .app {
      max-width: 760px;
      margin: auto;
      padding: 18px 14px 30px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .logo {
      width: 46px;
      height: 46px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      box-shadow: 0 10px 35px rgba(168,85,247,.25);
      font-size: 22px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: -.4px;
    }

    .subtitle {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .icon-btn {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 13px;
      min-width: 44px;
      min-height: 44px;
      cursor: pointer;
    }

    .search {
      position: relative;
      margin-bottom: 14px;
    }

    .search input {
      width: 100%;
      border: 1px solid var(--border);
      background: rgba(17,17,26,.88);
      color: var(--text);
      outline: none;
      padding: 14px 16px 14px 44px;
      border-radius: 15px;
    }

    .search span {
      position: absolute;
      left: 15px;
      top: 11px;
      font-size: 18px;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 5px;
      margin-bottom: 17px;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar { display: none; }

    .cat {
      white-space: nowrap;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--muted);
      border-radius: 999px;
      padding: 9px 13px;
      cursor: pointer;
    }

    .cat.active {
      color: white;
      border-color: rgba(168,85,247,.5);
      background: rgba(168,85,247,.18);
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 8px 2px 12px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 16px;
    }

    .count {
      color: var(--muted);
      font-size: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 12px;
    }

    .card {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(24,24,36,.96), rgba(12,12,18,.96));
      border-radius: var(--radius);
      min-width: 0;
    }

    .avatar {
      aspect-ratio: 1 / 1;
      display: grid;
      place-items: center;
      font-size: 64px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 35%, rgba(255,255,255,.12), transparent 34%),
        linear-gradient(145deg, rgba(168,85,247,.30), rgba(236,72,153,.13));
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-body {
      padding: 12px;
    }

    .name-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .name {
      font-weight: 750;
      font-size: 15px;
    }

    .category {
      color: var(--muted);
      font-size: 11px;
      margin-top: 2px;
    }

    .description {
      color: #c5c5d1;
      font-size: 12px;
      line-height: 1.4;
      margin: 8px 0 10px;
      min-height: 34px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 11px;
    }

    .tag {
      color: #cfc0ff;
      background: rgba(168,85,247,.12);
      border-radius: 999px;
      padding: 4px 7px;
      font-size: 10px;
    }

    .talk {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 11px;
      color: white;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(90deg, #8b5cf6, #ec4899);
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--muted);
      padding: 35px 10px;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.68);
      display: none;
      align-items: flex-end;
      z-index: 20;
    }

    .modal.open { display: flex; }

    .sheet {
      width: 100%;
      max-width: 760px;
      margin: auto;
      background: #101018;
      border: 1px solid var(--border);
      border-radius: 24px 24px 0 0;
      padding: 18px;
    }

    .sheet-top {
      display: flex;
      gap: 13px;
      align-items: center;
    }

    .sheet-avatar {
      width: 70px;
      height: 70px;
      border-radius: 19px;
      display: grid;
      place-items: center;
      font-size: 36px;
      overflow: hidden;
      background: linear-gradient(145deg, rgba(168,85,247,.32), rgba(236,72,153,.2));
    }

    .sheet-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .sheet h3 { margin: 0; font-size: 20px; }
    .sheet p { color: #c5c5d1; line-height: 1.5; font-size: 13px; }

    .sheet-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: 14px;
    }

    .sheet-actions button {
      min-height: 46px;
      border-radius: 13px;
      border: 1px solid var(--border);
      background: var(--panel2);
      color: white;
      cursor: pointer;
    }

    .sheet-actions .primary {
      border: 0;
      background: linear-gradient(90deg, #8b5cf6, #ec4899);
    }

    @media (min-width: 650px) {
      .grid { grid-template-columns: repeat(3, minmax(0,1fr)); }
    }
  </style>
</head>
<body>
<main class="app" id="app">
  <header>
    <div class="brand">
      <div class="logo">✦</div>
      <div>
        <h1>GOD BOT</h1>
        <div class="subtitle">4 personalidades · Infinitas conversaciones</div>
      </div>
    </div>
    <button class="icon-btn" id="favoritesBtn" type="button" aria-label="Favoritos">♡</button>
  </header>

  <div class="search">
    <span>⌕</span>
    <input id="search" type="search" placeholder="Buscar personaje..." autocomplete="off">
  </div>

  <nav class="categories" id="categories" aria-label="Categorías"></nav>

  <div class="section-title">
    <h2>✨ Personajes</h2>
    <span class="count" id="count"></span>
  </div>

  <section class="grid" id="grid"></section>
</main>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Perfil del personaje">
  <div class="sheet">
    <div class="sheet-top">
      <div class="sheet-avatar" id="modalAvatar">✨</div>
      <div>
        <h3 id="modalName"></h3>
        <div class="category" id="modalCategory"></div>
      </div>
    </div>
    <p id="modalDescription"></p>
    <div class="tags" id="modalTags"></div>
    <div class="sheet-actions">
      <button class="primary" id="talkBtn" type="button">💬 Hablar</button>
      <button id="imageBtn" type="button">🖼️ Imagen</button>
      <button id="favoriteModalBtn" type="button">♡ Favorito</button>
      <button id="closeBtn" type="button">Cerrar</button>
    </div>
  </div>
</div>

<script>
(() => {
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    if (tg.setHeaderColor) tg.setHeaderColor("#08080d");
    if (tg.setBackgroundColor) tg.setBackgroundColor("#08080d");
  }

  const characters = [
    {
      id: "luna",
      name: "Luna",
      category: "Original",
      emoji: "🌙",
      image: "assets/luna.png",
      description: "Tranquila, observadora, cariñosa, curiosa y un poco tímida. Le gusta escuchar, los atardeceres y las conversaciones profundas.",
      tags: ["Tranquila", "Observadora", "Cariñosa", "Curiosa", "Tímida"],
      likes: ["Música", "Anime", "Café", "Noches frías", "La luna", "Los gatos", "Libros", "Tú"],
      role: "La que te escucha, te entiende y siempre está ahí.",
      quote: "No todo lo bonito es sencillo... pero vale la pena."
    },
    {
      id: "astra",
      name: "Astra",
      category: "Original",
      emoji: "💜",
      image: "assets/astra.png",
      description: "Extrovertida, sarcástica, juguetona, segura y directa. Le encanta hacerte reír y siempre ve el lado divertido de las cosas.",
      tags: ["Extrovertida", "Sarcástica", "Juguetona", "Segura", "Directa"],
      likes: ["Música", "Videojuegos", "Anime", "Comida chatarra", "El desmadre", "Tú"],
      role: "La que te anima, te motiva y hace que todo sea más interesante.",
      quote: "La vida es más divertida cuando la tomas en serio... pero no tanto."
    },
    {
      id: "nyx",
      name: "Nyx",
      category: "Original",
      emoji: "🖤",
      image: "assets/nyx.png",
      description: "Fría, leal, intensa, reservada y un poco peligrosa. No confía fácil, pero cuando lo hace, es para siempre.",
      tags: ["Fría", "Leal", "Intensa", "Reservada", "Peligrosa"],
      likes: ["Anime", "Metal", "El silencio", "Las noches lluviosas", "El caos", "La adrenalina", "Tú"],
      role: "La que te desafía, te protege y te muestra un lado más oscuro de la vida.",
      quote: "No soy mala... solo tengo mejores formas de ser real."
    },
    {
      id: "akio",
      name: "Akio",
      category: "Femboy",
      emoji: "💙",
      description: "Un femboy carismático, coqueto y expresivo. Juguetón cuando entra en confianza, dulce cuando menos te lo esperas y con una confianza que puede desarmarte.",
      tags: ["Femboy", "Coqueto", "Dulce", "Juguetón", "Seguro"],
      likes: ["Anime", "Moda", "Videojuegos", "Música", "Dulces", "Accesorios", "Tú"],
      role: "El que convierte cualquier conversación en algo inesperadamente divertido.",
      quote: "¿Esperabas encontrarme aquí? Pues ahora ya no te vas a librar de mí. 💙"
    }
  ];

  let category = "Todos";
  let query = "";
  let favoritesOnly = false;
  let selected = null;
  const favorites = new Set();

  const $ = id => document.getElementById(id);

  const categories = ["Todos", ...new Set(characters.map(c => c.category))];

  function renderCategories() {
    $("categories").innerHTML = categories.map(c =>
      `<button class="cat ${c === category ? "active" : ""}" type="button" data-category="${escapeHtml(c)}">${escapeHtml(c)}</button>`
    ).join("");

    $("categories").querySelectorAll(".cat").forEach(btn => {
      btn.addEventListener("click", () => {
        category = btn.dataset.category;
        favoritesOnly = false;
        $("favoritesBtn").textContent = "♡";
        render();
        renderCategories();
      });
    });
  }

  function filtered() {
    const q = query.trim().toLowerCase();
    return characters.filter(c => {
      const matchesCategory = category === "Todos" || c.category === category;
      const matchesQuery = !q ||
        c.name.toLowerCase().includes(q) ||
        c.description.toLowerCase().includes(q) ||
        c.tags.some(t => t.toLowerCase().includes(q)) ||
        (c.likes || []).some(t => t.toLowerCase().includes(q)) ||
        (c.role || "").toLowerCase().includes(q) ||
        (c.quote || "").toLowerCase().includes(q);
      const matchesFavorites = !favoritesOnly || favorites.has(c.id);
      return matchesCategory && matchesQuery && matchesFavorites;
    });
  }

  function render() {
    const list = filtered();
    $("count").textContent = `${list.length} disponibles`;

    if (!list.length) {
      $("grid").innerHTML = `<div class="empty">No encontramos personajes con esos filtros.</div>`;
      return;
    }

    $("grid").innerHTML = list.map(c => `
      <article class="card">
        <div class="avatar">${c.image ? `<img src="${escapeHtml(c.image)}" alt="${escapeHtml(c.name)}">` : escapeHtml(c.emoji)}</div>
        <div class="card-body">
          <div class="name-row">
            <div>
              <div class="name">${escapeHtml(c.name)}</div>
              <div class="category">${escapeHtml(c.category)}</div>
            </div>
            <span aria-label="favorito">${favorites.has(c.id) ? "♥" : "♡"}</span>
          </div>
          <div class="description">${escapeHtml(c.description)}</div>
          <div class="tags">
            ${c.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join("")}
          </div>
          <button class="talk" type="button" data-id="${escapeHtml(c.id)}">💬 Ver personaje</button>
        </div>
      </article>
    `).join("");

    $("grid").querySelectorAll(".talk").forEach(btn => {
      btn.addEventListener("click", () => openCharacter(btn.dataset.id));
    });
  }

  function openCharacter(id) {
    selected = characters.find(c => c.id === id);
    if (!selected) return;

    $("modalAvatar").innerHTML = selected.image
      ? `<img src="${escapeHtml(selected.image)}" alt="${escapeHtml(selected.name)}">`
      : escapeHtml(selected.emoji);
    $("modalName").textContent = selected.name;
    $("modalCategory").textContent = selected.category;
    $("modalDescription").textContent =
      selected.description +
      (selected.role ? `\\n\\nRol: ${selected.role}` : "") +
      (selected.quote ? `\\n\\n“${selected.quote}”` : "");
    $("modalTags").innerHTML = [
      ...(selected.tags || []),
      ...(selected.likes || []).map(t => `♡ ${t}`)
    ].map(t => `<span class="tag">${escapeHtml(t)}</span>`).join("");
    $("favoriteModalBtn").textContent =
      favorites.has(selected.id) ? "♥ Quitar favorito" : "♡ Favorito";
    $("modal").classList.add("open");
  }

  function closeModal() {
    $("modal").classList.remove("open");
    selected = null;
  }

  function sendToBot(type) {
    if (!selected) return;

    const payload = JSON.stringify({
      action: type,
      character_id: selected.id
    });

    if (tg?.sendData) {
      tg.sendData(payload);
      tg.close();
    } else {
      // Fallback for browser preview.
      alert(`${type}: ${selected.name}`);
    }
  }

  $("talkBtn").addEventListener("click", () => sendToBot("chat"));
  $("imageBtn").addEventListener("click", () => sendToBot("image"));

  $("favoriteModalBtn").addEventListener("click", () => {
    if (!selected) return;
    if (favorites.has(selected.id)) favorites.delete(selected.id);
    else favorites.add(selected.id);
    $("favoriteModalBtn").textContent =
      favorites.has(selected.id) ? "♥ Quitar favorito" : "♡ Favorito";
    render();
  });

  $("closeBtn").addEventListener("click", closeModal);

  $("modal").addEventListener("click", e => {
    if (e.target === $("modal")) closeModal();
  });

  $("search").addEventListener("input", e => {
    query = e.target.value;
    render();
  });

  $("favoritesBtn").addEventListener("click", () => {
    favoritesOnly = !favoritesOnly;
    $("favoritesBtn").textContent = favoritesOnly ? "♥" : "♡";
    render();
  });

  function escapeHtml(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  renderCategories();
  render();
})();
</script>
</body>
</html>
